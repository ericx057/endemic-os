[package]
name = "endemic"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
